name: NekoBoxPlus APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

jobs:
  protocol-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -p verification/po0 test --no-daemon

  apk:
    needs: protocol-tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.6'
          cache-dependency-path: libcore/go.sum
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android toolchain
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.1' 'ndk;25.0.8775105'
      - uses: actions/cache@v4
        id: native
        with:
          path: app/libs/libcore.aar
          key: plus-native-${{ runner.os }}-${{ hashFiles('libcore/**', 'buildScript/**', '.github/workflows/nekoboxplus.yml') }}
      - name: Build native core
        if: steps.native.outputs.cache-hit != 'true'
        run: |
          bash -e buildScript/lib/core/init.sh
          bash -e buildScript/lib/core/build.sh
      - name: Download routing assets
        run: bash buildScript/lib/assets.sh
      - name: Build and test Android app
        run: ./gradlew :app:testOssDebugUnitTest :app:assembleOssDebug --no-daemon
      - name: Create APK checksums
        working-directory: app/build/outputs/apk/oss/debug
        run: sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NekoBoxPlus-debug-APKs
          path: |
            app/build/outputs/apk/oss/debug/*.apk
            app/build/outputs/apk/oss/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
